<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>NIMCET 2027 Tracker</title>
<style>
/* ============================================================
   NIMCET 2027 TRACKER — STYLES
   ============================================================ */

@import url('https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root {
  --bg: #F5F6F4;
  --panel: #FFFFFF;
  --panel-2: #FBFBF9;
  --border: #E2E4DE;
  --ink: #131B2C;
  --ink-soft: #4A5468;
  --muted: #7A8496;
  --brand: #1E3A5F;
  --brand-2: #2E5EAA;
  --accent: #B8862E;
  --accent-ink: #6b5316;
  --good: #2E7D5C;
  --good-bg: #E7F3ED;
  --warn: #B8862E;
  --warn-bg: #FBF2DF;
  --bad: #B84A3E;
  --bad-bg: #FBEAE7;
  --radius: 14px;
  --radius-sm: 9px;
  --shadow: 0 1px 2px rgba(19,27,44,0.04), 0 6px 20px rgba(19,27,44,0.05);
  --serif: 'Newsreader', Georgia, serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace;
}
[data-theme="dark"] {
  --bg: #10141F;
  --panel: #171C2A;
  --panel-2: #1C2233;
  --border: #2A3145;
  --ink: #ECEEF3;
  --ink-soft: #B7BECC;
  --muted: #838EA3;
  --brand: #7FA6E0;
  --brand-2: #6FA0E8;
  --accent: #E0B45E;
  --accent-ink: #E0B45E;
  --good: #6FCB9F;
  --good-bg: #163329;
  --warn: #E0B45E;
  --warn-bg: #332a15;
  --bad: #E38A7D;
  --bad-bg: #33201d;
  --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 10px 30px rgba(0,0,0,0.25);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { font-family: var(--serif); font-weight: 600; margin: 0 0 8px; color: var(--ink); }
p { line-height: 1.55; color: var(--ink-soft); margin: 0 0 10px; }
.muted { color: var(--muted); }
a { color: var(--brand-2); }
button, input, select, textarea { font-family: inherit; color: inherit; }

/* ---------- Shell layout ---------- */
.shell { display: flex; min-height: 100vh; }
.sidebar {
  width: 232px; flex-shrink: 0; background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 20px 14px;
  position: sticky; top: 0; height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 20px; }
.brand-mark {
  width: 38px; height: 38px; border-radius: 10px; background: var(--brand);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-weight: 600; font-size: 13px;
}
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-text strong { font-family: var(--serif); font-size: 17px; }
.brand-text span { font-size: 11.5px; color: var(--muted); letter-spacing: .02em; }
.navlist { display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
.navitem {
  display: flex; align-items: center; gap: 10px; text-align: left;
  padding: 9px 10px; border-radius: var(--radius-sm); border: none; background: transparent;
  color: var(--ink-soft); font-size: 14px; cursor: pointer; width: 100%;
}
.navitem:hover { background: var(--panel-2); }
.navitem.active { background: var(--brand); color: #fff; }
.navicon { width: 18px; text-align: center; opacity: .85; }
.theme-toggle {
  margin-top: 10px; border: 1px solid var(--border); background: var(--panel-2);
  color: var(--ink-soft); padding: 9px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px;
}
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 28px; border-bottom: 1px solid var(--border); background: var(--panel);
  position: sticky; top: 0; z-index: 5;
}
.topbar-count { font-family: var(--mono); font-size: 13px; color: var(--ink-soft); }
.tb-num { color: var(--brand); font-weight: 600; }
.content { padding: 24px 28px 80px; max-width: 980px; width: 100%; margin: 0 auto; }
.bottomnav { display: none; }

@media (max-width: 880px) {
  .sidebar { display: none; }
  .content { padding: 16px 14px 92px; }
  .topbar { padding: 12px 14px; }
  .bottomnav {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: var(--panel); border-top: 1px solid var(--border);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .bnitem { flex: 1; background: none; border: none; padding: 8px; font-size: 19px; color: var(--muted); border-radius: 10px; }
  .bnitem.active { color: var(--brand-2); background: var(--panel-2); }
}

/* ---------- Cards / grids ---------- */
.card {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 20px; margin-bottom: 16px; box-shadow: var(--shadow);
}
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.card-head h3, .card-head h4 { margin: 0; }
.grid { display: grid; gap: 16px; }
.stats-grid { grid-template-columns: repeat(4, 1fr); }
.two-col { grid-template-columns: 1fr 1fr; }
@media (max-width: 880px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .two-col { grid-template-columns: 1fr; } }

.stat { display: flex; flex-direction: column; gap: 6px; }
.stat-label { font-size: 12.5px; color: var(--muted); text-transform: none; }
.stat-value { font-family: var(--serif); font-size: 28px; font-weight: 600; }
.stat-value .muted { font-size: 15px; font-family: var(--sans); }
.stat-note { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

/* ---------- Hero countdown ---------- */
.hero-count {
  background: linear-gradient(135deg, var(--brand) 0%, #163156 100%);
  color: #fff; text-align: center; padding: 34px 20px; border: none;
}
.hero-label { font-size: 12.5px; letter-spacing: .08em; opacity: .8; margin-bottom: 6px; }
.hero-days { font-family: var(--mono); font-size: 76px; font-weight: 600; line-height: 1; color: var(--accent); }
.hero-days span { display: block; font-family: var(--sans); font-size: 15px; letter-spacing: .1em; color: #fff; opacity: .85; margin-top: 6px; }
.hero-sub { margin-top: 10px; font-size: 13.5px; opacity: .9; }

/* ---------- Progress bars / circular ---------- */
.pbar { height: 8px; border-radius: 6px; background: var(--border); overflow: hidden; margin: 6px 0; }
.pbar-fill { height: 100%; background: var(--brand-2); border-radius: 6px; transition: width .3s; }
.cprog { position: relative; display: inline-flex; align-items: center; justify-content: center; }
.cprog svg { transform: rotate(-90deg); }
.cprog-track { fill: none; stroke: var(--border); stroke-width: 8; }
.cprog-fill { fill: none; stroke: var(--brand-2); stroke-width: 8; stroke-linecap: round; transition: stroke-dasharray .3s; }
.cprog-text { position: absolute; text-align: center; font-family: var(--serif); }
.cprog-text span { display: block; font-family: var(--sans); font-size: 10px; color: var(--muted); }

/* ---------- Status banner ---------- */
.status-banner { display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
.status-left { display: flex; align-items: center; gap: 12px; }
.status-emoji { font-size: 28px; }
.status-title { font-family: var(--serif); font-weight: 600; font-size: 17px; }
.status-desc { color: var(--ink-soft); font-size: 13.5px; max-width: 480px; }
.status-right { display: flex; gap: 18px; font-size: 13px; color: var(--ink-soft); }
.status-ahead { border-left: 4px solid var(--good); }
.status-behind { border-left: 4px solid var(--bad); }
.status-ontrack { border-left: 4px solid var(--warn); }

/* ---------- Buttons ---------- */
.btn {
  border: 1px solid var(--border); background: var(--panel-2); color: var(--ink);
  padding: 9px 16px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13.5px; font-weight: 500;
}
.btn:hover { border-color: var(--brand-2); }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { opacity: .92; }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 11px; font-size: 12.5px; }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.file-btn input { display: none; }

/* ---------- Plan lists ---------- */
.plan-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.plan-list li { font-size: 14px; padding: 8px 10px; background: var(--panel-2); border-radius: var(--radius-sm); }
.plan-list.big li { font-size: 14.5px; padding: 10px 12px; }
.attn-list { display: flex; flex-direction: column; gap: 8px; }
.attn-row { display: flex; justify-content: space-between; font-size: 14px; padding: 6px 2px; border-bottom: 1px dashed var(--border); }
.attn-row:last-child { border-bottom: none; }

.mini-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
.mini-stats > div { display: flex; justify-content: space-between; font-size: 13.5px; border-bottom: 1px dashed var(--border); padding-bottom: 6px; }

.subject-snap { display: flex; flex-direction: column; gap: 12px; }
.snap-row { display: grid; grid-template-columns: 24px 78px 1fr 40px; align-items: center; gap: 8px; }
.snap-icon { width: 24px; height: 24px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 13px; }
.snap-name { font-size: 13px; }
.snap-pct { font-size: 12.5px; text-align: right; color: var(--muted); font-family: var(--mono); }
.snap-row .pbar { margin: 0; }

/* ---------- Syllabus ---------- */
.syl-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.syl-tab {
  border: 1px solid var(--border); background: var(--panel); padding: 8px 14px; border-radius: 999px;
  cursor: pointer; font-size: 13.5px; display: flex; align-items: center; gap: 6px;
}
.syl-tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.syl-tab .pill { background: rgba(255,255,255,0.25); padding: 1px 7px; border-radius: 999px; font-size: 11.5px; }
.syl-tab:not(.active) .pill { background: var(--panel-2); color: var(--muted); }
.chapter-card { padding-bottom: 8px; }
.topic-list { display: flex; flex-direction: column; }
.topic-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 2px; border-bottom: 1px solid var(--border); font-size: 13.8px;
}
.topic-row:last-child { border-bottom: none; }
.topic-title { flex: 1; }
.topic-status { border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; background: var(--panel-2); font-size: 12.5px; }
.pill { background: var(--panel-2); border: 1px solid var(--border); padding: 2px 10px; border-radius: 999px; font-size: 12px; color: var(--ink-soft); }
.badge { padding: 2px 9px; border-radius: 999px; font-size: 12px; border: 1px solid var(--c); color: var(--c); }

/* ---------- Timeline ---------- */
.timeline { position: relative; padding-left: 24px; }
.timeline::before { content: ''; position: absolute; left: 6px; top: 6px; bottom: 6px; width: 2px; background: var(--border); }
.tl-item { position: relative; padding-bottom: 26px; }
.tl-dot { position: absolute; left: -24px; top: 4px; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); border: 3px solid var(--border); }
.tl-item.current .tl-dot { border-color: var(--brand-2); background: var(--brand-2); }
.tl-item.past .tl-dot { border-color: var(--good); background: var(--good); }
.tl-body { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.tl-item.current .tl-body { border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(46,94,170,0.08); }
.tl-head { display: flex; justify-content: space-between; margin-bottom: 4px; }
.current-pill { background: var(--brand); color: #fff; border: none; margin-top: 6px; display: inline-block; }

/* ---------- Monthly / weekly ---------- */
.month-card, .week-grid { margin-bottom: 16px; }
.month-subj { margin: 10px 0; }
.month-subj strong { font-size: 13.5px; }
.check-list { list-style: none; margin: 6px 0 0; padding: 0; }
.check-list li { padding: 6px 2px; font-size: 13.8px; border-bottom: 1px dashed var(--border); }
.check-list li:last-child { border-bottom: none; }
.check-list li.done label { text-decoration: line-through; color: var(--muted); }
.check-list label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.month-targets { display: flex; gap: 14px; font-size: 13px; color: var(--ink-soft); margin: 10px 0; flex-wrap: wrap; }

.week-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.week-title { font-family: var(--serif); font-size: 16px; font-weight: 600; }
.week-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; }
@media (max-width: 880px) { .week-grid { grid-template-columns: 1fr 1fr; } }
.day-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px; min-height: 120px; }
.day-card.today { border-color: var(--brand-2); box-shadow: 0 0 0 3px rgba(46,94,170,0.08); }
.day-head { font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
.day-items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.day-items li { font-size: 12px; line-height: 1.4; }
.day-items label { display: flex; gap: 5px; align-items: flex-start; cursor: pointer; }
.day-items .done label { text-decoration: line-through; color: var(--muted); }
.tag { font-size: 10.5px; font-weight: 600; border: 1px solid currentColor; border-radius: 5px; padding: 0 4px; margin-right: 2px; }

/* ---------- Forms ---------- */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-bottom: 12px; }
@media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
.form-grid label, .card > label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--ink-soft); }
input, select, textarea {
  border: 1px solid var(--border); background: var(--panel-2); border-radius: 8px;
  padding: 8px 10px; font-size: 13.5px; color: var(--ink); width: 100%;
}
textarea { resize: vertical; }
.checkbox-row { flex-direction: row !important; align-items: center; gap: 8px !important; }

.study-table { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 8px; }
.study-table th, .study-table td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
.study-table th { color: var(--muted); font-weight: 500; font-size: 12px; }
.hour-input { max-width: 80px; }
.daily-calc { display: flex; gap: 20px; margin: 10px 0; font-size: 13.5px; }
.save-note { margin-left: 10px; color: var(--good); font-size: 13px; }

.notes-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
@media (max-width: 880px) { .notes-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { .notes-grid { grid-template-columns: 1fr; } }
.note-card p { color: var(--ink); font-size: 13.8px; margin: 0; }
.icon-btn { border: none; background: none; cursor: pointer; font-size: 14px; }
.callout { background: var(--warn-bg); color: var(--accent-ink); padding: 8px 12px; border-radius: 8px; font-size: 13px; }
.empty { text-align: center; color: var(--muted); padding: 30px; }

.chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { border: 1px solid var(--border); background: var(--panel-2); padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 13px; }
.chip.selected { background: var(--brand); color: #fff; border-color: var(--brand); }

/* ---------- Setup wizard ---------- */
.setup-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); padding: 20px; }
.setup-card { max-width: 520px; width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 30px 30px 26px; box-shadow: var(--shadow); }
.setup-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.setup-brand div:last-child { display: flex; flex-direction: column; line-height: 1.3; }
.setup-brand strong { font-family: var(--serif); font-size: 19px; }
.setup-brand span { font-size: 12.5px; color: var(--muted); }
.wiz-progress { display: flex; gap: 6px; margin-bottom: 18px; }
.wiz-progress span { flex: 1; height: 4px; border-radius: 3px; background: var(--border); }
.wiz-progress span.on { background: var(--brand-2); }
.notice { background: var(--warn-bg); color: var(--accent-ink); border-radius: 10px; padding: 12px 14px; font-size: 13px; margin: 14px 0; }
#setupBody label { display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; color: var(--ink-soft); margin-bottom: 14px; }
.wiz-actions { display: flex; justify-content: space-between; margin-top: 8px; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

</style>
</head>

let cloud = { enabled: false, ready: false, user: null, db: null, auth: null, timer: null, syncing: false };
const CLOUD_DOC = 'nimcet2027';

function firebaseConfigured() {
  return typeof firebase !== 'undefined' && window.NIMCET_FIREBASE_CONFIG &&
    window.NIMCET_FIREBASE_CONFIG.apiKey &&
    window.NIMCET_FIREBASE_CONFIG.projectId &&
    window.NIMCET_FIREBASE_CONFIG.appId &&
    !String(window.NIMCET_FIREBASE_CONFIG.apiKey).includes('PASTE_');
}

function initCloud() {
  if (!firebaseConfigured()) return;
  try {
    if (!firebase.apps.length) firebase.initializeApp(window.NIMCET_FIREBASE_CONFIG);
    cloud.auth = firebase.auth();
    cloud.db = firebase.firestore();
    cloud.enabled = true;
    cloud.ready = true;
    cloud.auth.onAuthStateChanged(async user => {
      cloud.user = user || null;
      updateSyncBadge();
      if (user) await pullCloudState();
    });
  } catch (e) {
    console.warn('Cloud sync unavailable:', e);
  }
}

function scheduleCloudSave() {
  if (!cloud.ready || !cloud.user || cloud.syncing) return;
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(pushCloudState, 800);
}

async function pushCloudState() {
  if (!cloud.ready || !cloud.user || cloud.syncing) return;
  cloud.syncing = true; updateSyncBadge('Saving…');
  try {
    await cloud.db.collection('users').doc(cloud.user.uid).collection('apps').doc(CLOUD_DOC).set({
      state: JSON.stringify(state), updatedAt: state.updatedAt, updatedBy: cloud.user.uid
    });
    updateSyncBadge('Synced');
  } catch (e) {
    console.warn('Cloud save failed:', e); updateSyncBadge('Sync error');
  } finally { cloud.syncing = false; }
}

async function pullCloudState() {
  if (!cloud.ready || !cloud.user) return;
  updateSyncBadge('Checking…');
  try {
    const snap = await cloud.db.collection('users').doc(cloud.user.uid).collection('apps').doc(CLOUD_DOC).get();
    if (snap.exists && snap.data().state) {
      const remote = JSON.parse(snap.data().state);
      const remoteTime = Number(snap.data().updatedAt || remote.updatedAt || 0);
      const localTime = Number(state.updatedAt || 0);
      if (remoteTime > localTime) {
        state = Object.assign(defaultState(), remote);
        saveState({ skipCloud: true });
        activeWeekIndex = null;
        render();
      } else if (localTime > remoteTime) {
        await pushCloudState();
      }
    }
    updateSyncBadge('Synced');
  } catch (e) {
    console.warn('Cloud pull failed:', e); updateSyncBadge('Sync error');
  }
}

async function cloudSignUp(email, password) {
  if (!cloud.ready) throw new Error('Cloud sync is not configured.');
  return cloud.auth.createUserWithEmailAndPassword(email, password);

async function cloudSignIn(email, password) {

/* ---------------- Date utilities ---------------- */
function pad(n) { return String(n).padStart(2, '0'); }
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}
function parseDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function fmtDate(dateObj) {
  return `${dateObj.getFullYear()}-${pad(dateObj.getMonth() + 1)}-${pad(dateObj.getDate())}`;
}
function addDays(dateStr, n) {
  const d = parseDate(dateStr);
  d.setDate(d.getDate() + n);
  return fmtDate(d);
}
function daysBetween(aStr, bStr) {
  const a = parseDate(aStr), b = parseDate(bStr);
  return Math.round((b - a) / 86400000);
}
function displayDate(s, opts) {
  const d = parseDate(s);
  return d.toLocaleDateString('en-IN', opts || { day: 'numeric', month: 'short', year: 'numeric' });
}
function weekdayName(s) {
  return parseDate(s).toLocaleDateString('en-IN', { weekday: 'short' });
}
function monthKey(s) {
  const d = parseDate(s);
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
}
function monthLabel(key) {
  const [y, m] = key.split('-').map(Number);
  return new Date(y, m - 1, 1).toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
}

/* ---------------- Syllabus flattening ---------------- */
function flattenTopics() {
  // returns ordered array {id, subject, chapterIdx, chapterName, topicIdx, title}
  const out = [];
  SUBJECT_KEYS.forEach(subj => {
    SYLLABUS[subj].chapters.forEach((ch, ci) => {
      ch.topics.forEach((t, ti) => {
        out.push({ id: `${subj}__${ci}__${ti}`, subject: subj, chapterIdx: ci, chapterName: ch.name, topicIdx: ti, title: t });
      });
    });
  });
  return out;
}
const ALL_TOPICS = flattenTopics();
const ALL_TOPICS_BY_SUBJECT = SUBJECT_KEYS.reduce((acc, s) => {
  acc[s] = ALL_TOPICS.filter(t => t.subject === s);
  return acc;
}, {});

// Weighted interleave order (math:reasoning:computer:english ~= 5:4:2:1)
function combinedTopicOrder() {
  const queues = SUBJECT_KEYS.map(s => ALL_TOPICS_BY_SUBJECT[s].slice());
  const weights = { math: 5, reasoning: 4, computer: 2, english: 1 };
  const out = [];
  let remaining = queues.reduce((a, q) => a + q.length, 0);
  while (remaining > 0) {
    SUBJECT_KEYS.forEach(s => {
      const q = queues[SUBJECT_KEYS.indexOf(s)];
      for (let i = 0; i < weights[s]; i++) {
        if (q.length) { out.push(q.shift()); remaining--; }
      }
    });
  }
  return out;
}
const COMBINED_ORDER = combinedTopicOrder();

/* ---------------- Progress helpers ---------------- */
function getProgress(id) {
  return state.progress[id] || { status: 'not-started', completedAt: null, revisionStage: 0, nextRevision: null, lastRevised: null };
}
function setTopicStatus(id, status) {
  const p = Object.assign({}, getProgress(id));
  p.status = status;
  if (status === 'completed') {
    p.completedAt = todayStr();
    p.revisionStage = 0;
    p.nextRevision = addDays(todayStr(), REVISION_STAGES[0]);
  }
  if (status === 'not-started' || status === 'learning') {
    p.completedAt = null; p.revisionStage = 0; p.nextRevision = null;
  }
  if (status === 'strong') {
    p.nextRevision = null;
  }
  state.progress[id] = p;
  saveState();
}
function markRevised(id) {
  const p = Object.assign({}, getProgress(id));
  if (p.status !== 'completed' && p.status !== 'needs-revision') return;
  const nextStage = p.revisionStage + 1;
  p.lastRevised = todayStr();
  if (nextStage < REVISION_STAGES.length) {
    p.revisionStage = nextStage;
    p.nextRevision = addDays(p.completedAt || todayStr(), REVISION_STAGES[nextStage]);
    p.status = 'completed';
  } else {
    p.status = 'strong';
    p.nextRevision = null;
  }
  state.progress[id] = p;
  saveState();
}
function topicsBySubjectStatusCount(subj) {
  const counts = { 'not-started': 0, learning: 0, completed: 0, 'needs-revision': 0, strong: 0 };
  ALL_TOPICS_BY_SUBJECT[subj].forEach(t => { counts[getProgress(t.id).status]++; });
  return counts;
}
function subjectCompletionPct(subj) {
  const total = ALL_TOPICS_BY_SUBJECT[subj].length;
  const c = topicsBySubjectStatusCount(subj);
  const done = c.completed + c.strong;
  return total ? Math.round((done / total) * 100) : 0;
}
function overallCompletionPct() {

}
function completedTopicIds() {

}
function revisionDueList(dateStr) {

    return p.status === 'completed' && p.nextRevision && p.nextRevision <= d;

}

/* ---------------- Phase / timeline ---------------- */
function getPhaseSchedule() {
  const start = state.startDate;
  const end = state.examDate;
  const totalDays = Math.max(daysBetween(start, end), 1);
  let cursor = 0;
  const schedule = [];
  PHASES.forEach((ph, i) => {
    let len = Math.round(totalDays * ph.pct);
    if (i === PHASES.length - 1) len = totalDays - cursor; // absorb rounding into last phase
    const phStart = addDays(start, cursor);
    const phEnd = addDays(start, Math.min(cursor + len, totalDays));
    schedule.push(Object.assign({}, ph, { startDate: phStart, endDate: phEnd, days: len }));
    cursor += len;
  });
  return schedule;
}
function currentPhase() {
  const today = todayStr();
  const sched = getPhaseSchedule();
  if (today < state.startDate) return sched[0];
  if (today > state.examDate) return null; // exam passed
  for (const ph of sched) {
    if (today >= ph.startDate && today <= ph.endDate) return ph;
  }
  return sched[sched.length - 1];
}
function learningPhaseRange() {
  const sched = getPhaseSchedule();
  return { start: sched[0].startDate, end: sched[1].endDate };
}
function expectedCompletionPct() {
  const { start, end } = learningPhaseRange();
  const totalLearnDays = Math.max(daysBetween(start, end), 1);
  const elapsed = Math.min(Math.max(daysBetween(start, todayStr()), 0), totalLearnDays);
  return Math.round((elapsed / totalLearnDays) * 100);
}
function scheduleStatus() {
  const actual = overallCompletionPct();
  const expected = expectedCompletionPct();
  const diff = actual - expected;
  if (diff >= 5) return { level: 'ahead', label: 'Ahead of Schedule', diff };
  if (diff <= -5) return { level: 'behind', label: 'Behind Schedule', diff };
  return { level: 'ontrack', label: 'On Track', diff };
}

/* ---------------- Monthly plan ---------------- */
function monthsList() {
  const months = [];
  let cursor = monthKey(state.startDate);
  const endKey = monthKey(state.examDate);
  let [y, m] = cursor.split('-').map(Number);
  while (true) {
    const key = `${y}-${pad(m)}`;
    const firstDay = fmtDate(new Date(y, m - 1, 1));
    const lastDay = fmtDate(new Date(y, m, 0));
    months.push({
      key,
      label: monthLabel(key),
      start: firstDay < state.startDate ? state.startDate : firstDay,
      end: lastDay > state.examDate ? state.examDate : lastDay
    });
    if (key === endKey) break;
    m++; if (m > 12) { m = 1; y++; }
    if (months.length > 36) break; // safety
  }
  return months;
}
function learningMonths() {
  const { start, end } = learningPhaseRange();
  return monthsList().filter(mo => mo.end >= start && mo.start <= end);
}
function monthTopicAllocation() {
  // returns map monthKey -> [topicIds]
  const lm = learningMonths();
  const map = {};
  if (lm.length === 0) return map;
  const per = Math.ceil(COMBINED_ORDER.length / lm.length);
  lm.forEach((mo, i) => {
    map[mo.key] = COMBINED_ORDER.slice(i * per, (i + 1) * per).map(t => t.id);
  });
  return map;
}
function phaseForDate(dateStr) {
  const sched = getPhaseSchedule();
  for (const ph of sched) if (dateStr >= ph.startDate && dateStr <= ph.endDate) return ph;
  return sched[sched.length - 1];
}
function dominantPhaseForRange(startD, endD) {
  const sched = getPhaseSchedule();
  const overlap = {};
  sched.forEach(ph => {
    const s = startD > ph.startDate ? startD : ph.startDate;
    const e = endD < ph.endDate ? endD : ph.endDate;
    const d = daysBetween(s, e);
    if (d >= 0) overlap[ph.key] = (overlap[ph.key] || 0) + d + 1;
  });
  let best = null, bestVal = -1;
  Object.keys(overlap).forEach(k => { if (overlap[k] > bestVal) { bestVal = overlap[k]; best = k; } });
  return sched.find(p => p.key === best) || sched[0];
}
const PHASE_TARGETS = {
  foundation: { questions: 150, mocks: 0 },
  completion: { questions: 300, mocks: 0 },
  practice:   { questions: 600, mocks: 1 },
  revision:   { questions: 350, mocks: 2 },
  mocks:      { questions: 200, mocks: 4 },
  final:      { questions: 150, mocks: 3 }
};
function monthPlan(mo) {
  const allocation = monthTopicAllocation();
  const topicIds = allocation[mo.key] || [];
  const dominant = dominantPhaseForRange(mo.start, mo.end);
  const targets = PHASE_TARGETS[dominant.key] || PHASE_TARGETS.foundation;
  const doneCount = topicIds.filter(id => { const s = getProgress(id).status; return s === 'completed' || s === 'strong'; }).length;
  const bySubject = { math: [], reasoning: [], computer: [], english: [] };
  topicIds.forEach(id => { const t = ALL_TOPICS.find(x => x.id === id); if (t) bySubject[t.subject].push(t); });
  return {
    key: mo.key, label: mo.label, start: mo.start, end: mo.end,
    phase: dominant, topicIds, bySubject,
    completion: topicIds.length ? Math.round((doneCount / topicIds.length) * 100) : 100,
    questionsTarget: targets.questions, mockTarget: targets.mocks
  };
}

/* ---------------- Weekly plan ---------------- */
function weekIndexForDate(dateStr) {
  return Math.floor(daysBetween(state.startDate, dateStr) / 7);
}
function weekRange(weekIndex) {
  const start = addDays(state.startDate, weekIndex * 7);
  let end = addDays(state.startDate, weekIndex * 7 + 6);
  if (end > state.examDate) end = state.examDate;
  return { start, end };
}
function totalWeeks() {
  return Math.max(1, Math.ceil((daysBetween(state.startDate, state.examDate) + 1) / 7));
}
function learningWeekIndices() {
  const { start, end } = learningPhaseRange();
  const out = [];
  for (let i = 0; i < totalWeeks(); i++) {
    const r = weekRange(i);
    if (r.end >= start && r.start <= end) out.push(i);
  }
  return out;
}
function weekTopicAllocation(weekIndex) {
  const lw = learningWeekIndices();
  const pos = lw.indexOf(weekIndex);
  if (pos === -1) return [];
  const per = Math.ceil(COMBINED_ORDER.length / lw.length);
  return COMBINED_ORDER.slice(pos * per, (pos + 1) * per).map(t => t.id);
}
function weekPlan(weekIndex) {
  const { start, end } = weekRange(weekIndex);
  const topicIds = weekTopicAllocation(weekIndex);
  const dominant = dominantPhaseForRange(start, end);
  const targets = PHASE_TARGETS[dominant.key] || PHASE_TARGETS.foundation;

  // collect all dates in range, split into study days (Mon-Sat) and Sundays
  const allDates = [];
  for (let d = start; d <= end; d = addDays(d, 1)) allDates.push(d);
  const studyDates = allDates.filter(d => parseDate(d).getDay() !== 0);

  // spread topicIds evenly across study days (some days may get 0, 1 or 2+)
  const perDay = studyDates.length ? Math.ceil(topicIds.length / studyDates.length) : 0;
  const topicsByDate = {};
  studyDates.forEach((d, i) => { topicsByDate[d] = topicIds.slice(i * perDay, (i + 1) * perDay); });

  const days = allDates.map(d => {
    const items = [];
    if (parseDate(d).getDay() === 0) {
      items.push({ type: 'mock', label: dominant.key === 'mocks' || dominant.key === 'final' ? 'Full-length mock test' : 'Weekly self-test / revision day' });
      items.push({ type: 'revision', label: "Revise this week's topics" });
    } else {
      const slice = topicsByDate[d] || [];
      if (slice.length) {
        slice.forEach(id => {
          const t = ALL_TOPICS.find(x => x.id === id);
          if (t) items.push({ type: 'topic', id: t.id, subject: t.subject, title: t.title });
        });
      } else {
        items.push({ type: 'practice', label: `Practice — ${Math.max(15, Math.round(targets.questions / Math.max(studyDates.length, 1)))} questions` });
      }
    }
    return { date: d, weekday: weekdayName(d), items };
  });
  const doneCount = topicIds.filter(id => { const s = getProgress(id).status; return s === 'completed' || s === 'strong'; }).length;
  return {
    weekIndex, start, end, phase: dominant, topicIds, days,
    goalTopics: topicIds.length,
    completion: topicIds.length ? Math.round((doneCount / topicIds.length) * 100) : 100,
    questionsTarget: targets.questions, mockTarget: targets.mocks,
    expectedHours: state.dailyHoursGoal * 7
  };
}

/* ---------------- Daily plan ---------------- */
function getDailyLog(dateStr) {
  const d = dateStr || todayStr();
  return state.dailyLogs[d] || {
    hours: { math: 0, reasoning: 0, computer: 0, english: 0 },
    attempted: 0, correct: 0, wrong: 0,
    topicsCompleted: [], revisionCompleted: [], mockScore: null
  };
}
function saveDailyLog(dateStr, log) {
  state.dailyLogs[dateStr] = log;
  updateStreak(dateStr, log);
  saveState();
}
function logHasActivity(log) {
  const totalHours = Object.values(log.hours).reduce((a, b) => a + Number(b || 0), 0);
  return totalHours > 0 || log.attempted > 0 || (log.topicsCompleted && log.topicsCompleted.length > 0);
}
function updateStreak(dateStr, log) {
  if (!logHasActivity(log)) return;
  if (state.streakLast === dateStr) return; // already counted today
  if (state.streakLast && addDays(state.streakLast, 1) === dateStr) {
    state.streakCurrent += 1;
  } else if (state.streakLast === null) {
    state.streakCurrent = 1;
  } else if (state.streakLast === dateStr) {
    // no-op
  } else {
    state.streakCurrent = 1;
  }
  state.streakLast = dateStr;
}
function dailyPlan(dateStr) {
  const d = dateStr || todayStr();
  const wi = weekIndexForDate(d);
  const wp = weekPlan(wi);
  const dayEntry = wp.days.find(x => x.date === d) || { items: [] };
  const due = revisionDueList(d);
  const weak = weakTopics();
  // priority: first uncompleted topic item today, else first weak topic
  const topicItems = dayEntry.items.filter(i => i.type === 'topic' && getProgress(i.id).status !== 'completed' && getProgress(i.id).status !== 'strong');
  let priority = topicItems[0] || null;
  if (!priority && weak.length) priority = { type: 'topic', id: weak[0].id, subject: weak[0].subject, title: weak[0].title, isWeak: true };
  const practiceCount = Math.max(20, Math.round(wp.questionsTarget / 6));
  const wd = parseDate(d).getDay();
  const isTestDay = wd === 0;
  return {
    date: d, dayEntry, priority, revisionDue: due, practiceCount,
    isTestDay, phase: wp.phase
  };
}

/* ---------------- Mock tests ---------------- */
function addMock(mock) {
  mock.id = 'm_' + Date.now();
  state.mocks.push(mock);
  saveState();
}
function mockStats() {
  const ms = state.mocks.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  if (!ms.length) return { count: 0 };
  const scores = ms.map(m => Number(m.score));
  const avg = Math.round(scores.reduce((a, b) => a + b, 0) / scores.length);
  const recent = scores.slice(-5);
  const recentAvg = Math.round(recent.reduce((a, b) => a + b, 0) / recent.length);
  return {
    count: ms.length,
    avg, recentAvg,
    highest: Math.max(...scores), lowest: Math.min(...scores),
    list: ms
  };
}

/* ---------------- Analytics helpers ---------------- */
function totalStudyHours() {
  let t = 0;
  Object.values(state.dailyLogs).forEach(l => { t += Object.values(l.hours || {}).reduce((a, b) => a + Number(b || 0), 0); });
  return Math.round(t * 10) / 10;
}
function totalQuestions() {
  let t = 0; Object.values(state.dailyLogs).forEach(l => t += Number(l.attempted || 0));
  return t;
}
function overallAccuracy() {
  let c = 0, a = 0;
  Object.values(state.dailyLogs).forEach(l => { c += Number(l.correct || 0); a += Number(l.attempted || 0); });
  return a ? Math.round((c / a) * 100) : 0;
}
function last30DaysHours() {
  const out = [];
  for (let i = 29; i >= 0; i--) {
    const d = addDays(todayStr(), -i);
    const log = state.dailyLogs[d];
    const h = log ? Object.values(log.hours).reduce((a, b) => a + Number(b || 0), 0) : 0;
    out.push({ date: d, hours: Math.round(h * 10) / 10 });
  }
  return out;
}
function subjectHoursTotals() {
  const totals = { math: 0, reasoning: 0, computer: 0, english: 0 };
  Object.values(state.dailyLogs).forEach(l => {
    SUBJECT_KEYS.forEach(s => totals[s] += Number((l.hours && l.hours[s]) || 0));
  });
  return totals;
}
function subjectQuestionAccuracy() {
  // approximate — daily logs don't split by subject, so use hours-weighted share of totals
  const totHours = subjectHoursTotals();
  const totH = Object.values(totHours).reduce((a, b) => a + b, 0) || 1;
  const q = totalQuestions(), acc = overallAccuracy();
  const out = {};
  SUBJECT_KEYS.forEach(s => {
    const share = totHours[s] / totH;
    out[s] = { questions: Math.round(q * share), accuracy: acc };
  });
  return out;
}

<script>

function el(html) {

}
function $(sel, root) { return (root || document).querySelector(sel); }
function $all(sel, root) { return Array.from((root || document).querySelectorAll(sel)); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function progressBar(pct, colorVar) {
  const p = Math.max(0, Math.min(100, pct));
  return `<div class="pbar"><div class="pbar-fill" style="width:${p}%;${colorVar ? `background:${colorVar};` : ''}"></div></div>`;
}
function circularProgress(pct, size, label, sub) {
  const p = Math.max(0, Math.min(100, pct));
  const s = size || 96;
  return `<div class="cprog" style="--pct:${p};--size:${s}px">
    <svg viewBox="0 0 100 100" width="${s}" height="${s}">
      <circle class="cprog-track" cx="50" cy="50" r="42"></circle>
      <circle class="cprog-fill" cx="50" cy="50" r="42" style="stroke-dasharray:${p * 2.639} 263.9"></circle>
    </svg>
    <div class="cprog-text"><strong>${p}%</strong>${label ? `<span>${esc(label)}</span>` : ''}</div>
  </div>${sub ? `<div class="cprog-sub">${esc(sub)}</div>` : ''}`;
}
function statusBadge(status) {
  const s = STATUS[status] || STATUS['not-started'];
  return `<span class="badge" style="--c:${s.color}">${s.emoji} ${s.label}</span>`;
}

/* ============ APP SHELL ============ */

    case 'timeline': c.innerHTML = viewTimeline(); break;
    case 'monthly': c.innerHTML = viewMonthly(); wireMonthly(); return;
    case 'weekly': c.innerHTML = viewWeekly(); wireWeekly(); return;
    case 'daily': c.innerHTML = viewDaily(); wireDaily(); return;
    case 'subjects': c.innerHTML = viewSubjects(); wireSubjects(); return;
    case 'mocks': c.innerHTML = viewMocks(); wireMocks(); return;
    case 'revision': c.innerHTML = viewRevision(); wireRevision(); return;
    case 'notes': c.innerHTML = viewNotes(); wireNotes(); return;
    case 'analytics': c.innerHTML = viewAnalytics(); wireAnalytics(); return;

}

/* ============ DASHBOARD ============ */

    <div class="card stat"><div class="stat-label">This week</div><div class="stat-value">${wp.completion}%</div>${progressBar(wp.completion)}<div class="stat-note">${wp.goalTopics} topic target</div></div>
    <div class="card stat"><div class="stat-label">Current streak</div><div class="stat-value">🔥 ${state.streakCurrent} <span class="muted">days</span></div></div>

  <section class="grid two-col">

        <div><span>Prep days remaining</span><strong>${Math.max(days, 0)}</strong></div>
        <div><span>Questions solved</span><strong>${totalQuestions()}</strong></div>
        <div><span>Study hours logged</span><strong>${totHours}</strong></div>
        <div><span>Mock tests taken</span><strong>${state.mocks.length}</strong></div>
        <div><span>Overall accuracy</span><strong>${overallAccuracy()}%</strong></div>

}
function scheduleStatusText(st) {
  if (st.level === 'ahead') return `You're ${st.diff}% ahead of the plan for this stage. You could start early revision on completed subjects.`;
  if (st.level === 'behind') {
    const topicsBehind = Math.round((Math.abs(st.diff) / 100) * ALL_TOPICS.length);
    return `You're roughly ${Math.abs(st.diff)}% (~${topicsBehind} topics) behind schedule for this stage. Check Today's Plan — it has been adjusted to help you catch up gradually.`;

}
function renderTodayPlanMini(today) {
  const items = [];
  if (today.priority) items.push(`<li>🔴 Priority — <strong>${SYLLABUS[today.priority.subject].short}:</strong> ${esc(today.priority.title)}</li>`);
  items.push(`<li>🟡 Practice — ${today.practiceCount} questions</li>`);

  if (today.isTestDay) items.push(`<li>🟢 Test — ${today.phase.key === 'mocks' || today.phase.key === 'final' ? 'Full-length mock' : 'Weekly self-test'}</li>`);
  return `<ul class="plan-list">${items.join('')}</ul>`;
}
function renderNeedsAttention() {
  const rows = SUBJECT_KEYS.map(s => {
    const pct = subjectCompletionPct(s);
    const isWeak = state.weakSubjects.includes(s);
    const dueCount = revisionDueList().filter(t => t.subject === s).length;
    let level = 'green', text = 'On track';
    if (isWeak || pct < expectedCompletionPct() - 10) { level = 'red'; text = 'Weak — needs focus'; }
    else if (dueCount > 0) { level = 'yellow'; text = `Revision due (${dueCount})`; }
    const emoji = { red: '🔴', yellow: '🟡', green: '🟢' }[level];
    return `<div class="attn-row"><span>${emoji} ${SYLLABUS[s].short}</span><span class="muted">${text}</span></div>`;
  }).join('');
  return `<div class="attn-list">${rows}</div>`;

function wireDashboard() {

}

function wireSyllabus() {

function wireSyllabusBody() {

/* ============ TIMELINE ============ */
function viewTimeline() {
  const sched = getPhaseSchedule();

function viewMonthly() {
  const months = monthsList().map(monthPlan);
  return `
  <div class="page-head"><h2>Monthly Roadmap</h2><p class="muted">Topics are auto-distributed across the months that fall in your Foundation and Syllabus Completion phases; later months focus on practice, revision and mocks.</p></div>

      <div class="muted">${displayDate(mo.start)} – ${displayDate(mo.end)}</div>

        ${SUBJECT_KEYS.filter(s => mo.bySubject[s].length).map(s => `

      <div class="card-head"><span class="muted">Monthly completion</span><strong>${mo.completion}%</strong></div>

/* ============ WEEKLY ============ */
function viewWeekly() {
  if (activeWeekIndex === null) activeWeekIndex = weekIndexForDate(todayStr());
  const wp = weekPlan(activeWeekIndex);
  const tw = totalWeeks();
  return `
  <div class="page-head"><h2>Weekly Planner</h2><p class="muted">Automatically rebalances if you fall behind — topics not finished this week roll into upcoming free slots.</p></div>

/* ============ DAILY ============ */
function viewDaily() {
  const d = todayStr();
  const plan = dailyPlan(d);
  const log = getDailyLog(d);

  return `

function mockAccuracy(m) {
  const c = Number(m.correct || 0), i = Number(m.incorrect || 0);
  const tot = c + i;
  return tot ? Math.round((c / tot) * 100) : 0;
}
function renderMistakeList() {
  if (!state.mistakes.length) return '<p class="muted">No mistakes logged yet.</p>';
  const byCat = {};
  state.mistakes.forEach(m => { (byCat[m.category] = byCat[m.category] || []).push(m); });
  const topCat = Object.keys(byCat).sort((a, b) => byCat[b].length - byCat[a].length)[0];
  return `
    <p class="callout">Most frequent issue: <strong>${esc(topCat)}</strong> (${byCat[topCat].length} times). Consider dedicating a revision session to this.</p>
    <ul class="check-list">
      ${state.mistakes.slice().reverse().map(m => `<li>${displayDate(m.date)} — <strong>${esc(m.category)}:</strong> ${esc(m.note)}</li>`).join('')}

  `;
}
function wireMocks() {

    addMock({
      date: $('#mDate').value || todayStr(),
      name, score: Number(score),
      correct: $('#mCorrect').value ? Number($('#mCorrect').value) : null,
      incorrect: $('#mIncorrect').value ? Number($('#mIncorrect').value) : null,
      unattempted: $('#mUnattempted').value ? Number($('#mUnattempted').value) : null,
      timeTaken: $('#mTime').value ? Number($('#mTime').value) : null,
      rank: $('#mRank').value || null
    });
    render();
  });
  $('#addMistakeBtn')?.addEventListener('click', () => {
    const note = $('#mistakeNote').value.trim();
    if (!note) return;
    state.mistakes.push({ id: 'x_' + Date.now(), category: $('#mistakeCat').value, note, date: todayStr() });
    saveState();
    render();
  });
  if (mockStats().count) drawMockChart();
}
function drawMockChart() {
  const stats = mockStats();
  const ctx = document.getElementById('mockChart');
  if (!ctx || typeof Chart === 'undefined') return;
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: stats.list.map(m => displayDate(m.date, { day: 'numeric', month: 'short' })),
      datasets: [{ label: 'Score', data: stats.list.map(m => m.score), borderColor: '#2E5EAA', backgroundColor: 'rgba(46,94,170,0.12)', fill: true, tension: 0.3 }]
    },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
  });
}

      </tbody>
    </table>
    <p class="muted">Official source to monitor for the confirmed 2027 notification, dates, syllabus and pattern: <a href="${RESEARCH_NOTES.officialSite}" target="_blank" rel="noopener">${RESEARCH_NOTES.officialSite}</a>. The syllabus used in this tracker mirrors the syllabus published for the most recent edition; the conducting NIT sometimes issues a revised syllabus PDF before each cycle, so re-check it when the 2027 brochure is released.</p>
  </div>
  `;
}
function renderSyncPanel() {
  const panel = document.getElementById('syncPanel');
  if (!panel) return;
  updateSyncBadge();
  if (!cloud.enabled) {
    panel.innerHTML = '<p><strong>Cloud sync is not configured yet.</strong> Add your Firebase web config to <code>firebase-config.js</code>, then redeploy the app. Local progress remains fully usable.</p>';
    return;
  }
  if (cloud.user) {
    panel.innerHTML = `<div class="form-grid"><label>Signed in as <input value="${esc(cloud.user.email || '')}" disabled></label></div><div class="btn-row"><button class="btn primary" id="syncNowBtn">Sync now</button><button class="btn" id="signOutBtn">Sign out</button></div>`;
    $('#syncNowBtn').addEventListener('click', pullCloudState);
    $('#signOutBtn').addEventListener('click', async () => { await cloudSignOut(); render(); });
  } else {
    panel.innerHTML = `<div class="form-grid"><label>Email <input type="email" id="syncEmail" placeholder="you@example.com" autocomplete="email"></label><label>Password <input type="password" id="syncPassword" placeholder="At least 6 characters" autocomplete="current-password"></label></div><div class="btn-row"><button class="btn primary" id="signInBtn">Sign in & sync</button><button class="btn" id="signUpBtn">Create sync account</button></div><p class="muted">Create the account once, then use the same email and password on every device.</p>`;
    $('#signInBtn').addEventListener('click', async () => {
      try { await cloudSignIn($('#syncEmail').value.trim(), $('#syncPassword').value); render(); }
      catch (e) { alert(e.message || 'Sign-in failed.'); }
    });
    $('#signUpBtn').addEventListener('click', async () => {
      try { await cloudSignUp($('#syncEmail').value.trim(), $('#syncPassword').value); alert('Account created. Your progress will now sync.'); render(); }
      catch (e) { alert(e.message || 'Could not create account.'); }
    });
  }
}

function wireSettings() {
  renderSyncPanel();
  $('#saveSettingsBtn').addEventListener('click', () => {
    state.examDate = $('#setExamDate').value || state.examDate;
    state.examDateConfirmed = $('#setExamConfirmed').value === 'true';
    state.startDate = $('#setStartDate').value || state.startDate;
    state.dailyHoursGoal = Number($('#setDailyHours').value || state.dailyHoursGoal);
    state.weeklyHoursGoal = Number($('#setWeeklyHours').value || state.weeklyHoursGoal);
    state.monthlyHoursGoal = Number($('#setMonthlyHours').value || state.monthlyHoursGoal);
    state.questionsPerDayGoal = Number($('#setQPerDay').value || state.questionsPerDayGoal);
    state.topicsPerWeekGoal = Number($('#setTopicsPerWeek').value || state.topicsPerWeekGoal);
    state.mocksPerMonthGoal = Number($('#setMocksPerMonth').value || state.mocksPerMonthGoal);
    state.preferredStudyTime = $('#setPreferredTime').value;
    state.targetScore = Number($('#setTargetScore').value || state.targetScore);
    state.targetRank = Number($('#setTargetRank').value || state.targetRank);
    saveState();
    activeWeekIndex = null;
    render();
    alert('Settings saved.');
  });
  $('#exportBtn').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `nimcet2027-progress-${todayStr()}.json`;
    a.click();
  });
  $('#importFile').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        state = Object.assign(defaultState(), parsed);
        saveState();
        activeWeekIndex = null;
        render();
        alert('Progress imported.');
      } catch (err) { alert('Could not read that file.'); }
    };
    reader.readAsText(file);
  });
  $('#resetBtn').addEventListener('click', () => {
    if (confirm('This will erase all your saved progress in this browser. Continue?')) {
      localStorage.removeItem(STORAGE_KEY);
      state = defaultState();
      location.reload();
    }
  });
}

</script>
<script>
/* ============================================================
   NIMCET 2027 TRACKER — SETUP WIZARD + INIT
   ============================================================ */

let wizardStep = 0;
const WIZARD_ANSWERS = {};

function renderSetup() {
  document.documentElement.setAttribute('data-theme', state.darkMode ? 'dark' : 'light');
  const app = $('#app');
  app.innerHTML = `
    <div class="setup-wrap">
      <div class="setup-card">
        <div class="setup-brand"><div class="brand-mark">N27</div><div><strong>NIMCET 2027</strong><span>Preparation &amp; Countdown Tracker</span></div></div>
        <div id="setupBody"></div>
      </div>
    </div>
  `;
  renderWizardStep();
}

const WIZARD_STEPS = [
  {
    key: 'intro',
    render: () => `
      <h2>Let's set up your plan</h2>
      <p>A few quick questions so the app can build a personalised, adaptive NIMCET 2027 schedule for you. You can change any of this later in Settings.</p>
      <div class="notice">
        <strong>About the exam date:</strong> the official NIMCET 2027 date has not been announced yet. Based on how recent editions have run (NIMCET 2026 was held on 6 June 2026 by NIT Tiruchirappalli), this app defaults to an estimated date in early June 2027 — you can edit it below and again anytime once the real notification is out.
      </div>
      <button class="btn primary" id="wizNext">Get started →</button>
    `,
    wire: () => $('#wizNext').addEventListener('click', () => nextStep())
  },
  {
    key: 'examDate',
    render: () => `
      <h2>1. Exam date</h2>
      <label>Expected / confirmed NIMCET 2027 exam date
        <input type="date" id="wExamDate" value="${WIZARD_ANSWERS.examDate || '2027-06-07'}">
      </label>
      <label class="checkbox-row"><input type="checkbox" id="wExamConfirmed" ${WIZARD_ANSWERS.examDateConfirmed ? 'checked' : ''}> This date is officially confirmed</label>
      <div class="wiz-actions"><button class="btn" id="wizBack">← Back</button><button class="btn primary" id="wizNext">Continue →</button></div>
    `,
    wire: () => {
      $('#wizBack').addEventListener('click', prevStep);
      $('#wizNext').addEventListener('click', () => {
        WIZARD_ANSWERS.examDate = $('#wExamDate').value || '2027-06-07';
        WIZARD_ANSWERS.examDateConfirmed = $('#wExamConfirmed').checked;
        nextStep();
      });
    }
  },
  {
    key: 'level',
    render: () => `
      <h2>2. Where are you starting from?</h2>
      <label>Current syllabus completion — your best estimate
        <input type="range" min="0" max="100" step="5" id="wCompletion" value="${WIZARD_ANSWERS.initialCompletionPct ?? 0}">
        <span id="completionVal">${WIZARD_ANSWERS.initialCompletionPct ?? 0}%</span>
      </label>
      <label>Overall starting point
        <select id="wStartingLevel">
          <option value="zero" ${WIZARD_ANSWERS.startingLevel === 'zero' ? 'selected' : ''}>Starting from zero</option>
          <option value="some" ${WIZARD_ANSWERS.startingLevel === 'some' ? 'selected' : ''}>Some preparation already done</option>
          <option value="advanced" ${WIZARD_ANSWERS.startingLevel === 'advanced' ? 'selected' : ''}>Advanced — mostly revising</option>
        </select>
      </label>
      <div class="wiz-actions"><button class="btn" id="wizBack">← Back</button><button class="btn primary" id="wizNext">Continue →</button></div>
    `,
    wire: () => {
      $('#wCompletion').addEventListener('input', (e) => { $('#completionVal').textContent = e.target.value + '%'; });
      $('#wizBack').addEventListener('click', prevStep);
      $('#wizNext').addEventListener('click', () => {
        WIZARD_ANSWERS.initialCompletionPct = Number($('#wCompletion').value);
        WIZARD_ANSWERS.startingLevel = $('#wStartingLevel').value;
        nextStep();
      });
    }
  },
  {
    key: 'time',
    render: () => `
      <h2>3. Study time</h2>
      <label>Daily hours you can realistically study <input type="number" min="0.5" step="0.5" id="wDailyHours" value="${WIZARD_ANSWERS.dailyHoursGoal || 5}"></label>
      <label>Preferred study time
        <select id="wPreferredTime">
          ${['Early Morning', 'Morning', 'Afternoon', 'Evening', 'Night'].map(t => `<option ${WIZARD_ANSWERS.preferredStudyTime === t ? 'selected' : ''}>${t}</option>`).join('')}
        </select>
      </label>
      <div class="wiz-actions"><button class="btn" id="wizBack">← Back</button><button class="btn primary" id="wizNext">Continue →</button></div>
    `,
    wire: () => {
      $('#wizBack').addEventListener('click', prevStep);
      $('#wizNext').addEventListener('click', () => {
        WIZARD_ANSWERS.dailyHoursGoal = Number($('#wDailyHours').value || 5);
        WIZARD_ANSWERS.preferredStudyTime = $('#wPreferredTime').value;
        nextStep();
      });
    }
  },
  {
    key: 'strengths',
    render: () => `
      <h2>4. Strengths &amp; weak areas</h2>
      <label>Current strengths (select any)</label>
      <div class="chip-row" id="strengthChips">
        ${SUBJECT_KEYS.map(s => `<button type="button" class="chip ${((WIZARD_ANSWERS.strengths || []).includes(s)) ? 'selected' : ''}" data-s="${s}">${SYLLABUS[s].short}</button>`).join('')}
      </div>
      <label>Current weak subjects (select any)</label>
      <div class="chip-row" id="weakChips">
        ${SUBJECT_KEYS.map(s => `<button type="button" class="chip ${((WIZARD_ANSWERS.weakSubjects || []).includes(s)) ? 'selected' : ''}" data-s="${s}">${SYLLABUS[s].short}</button>`).join('')}
      </div>
      <div class="wiz-actions"><button class="btn" id="wizBack">← Back</button><button class="btn primary" id="wizNext">Continue →</button></div>
    `,
    wire: () => {
      const strengths = new Set(WIZARD_ANSWERS.strengths || []);
      const weaks = new Set(WIZARD_ANSWERS.weakSubjects || []);
      $all('#strengthChips .chip').forEach(c => c.addEventListener('click', () => { c.classList.toggle('selected'); c.classList.contains('selected') ? strengths.add(c.dataset.s) : strengths.delete(c.dataset.s); }));
      $all('#weakChips .chip').forEach(c => c.addEventListener('click', () => { c.classList.toggle('selected'); c.classList.contains('selected') ? weaks.add(c.dataset.s) : weaks.delete(c.dataset.s); }));
      $('#wizBack').addEventListener('click', prevStep);
      $('#wizNext').addEventListener('click', () => {
        WIZARD_ANSWERS.strengths = Array.from(strengths);
        WIZARD_ANSWERS.weakSubjects = Array.from(weaks);
        nextStep();
      });
    }
  },
  {
    key: 'targets',
    render: () => `
      <h2>5. Targets</h2>
      <label>Target score (out of 1000) <input type="number" id="wTargetScore" value="${WIZARD_ANSWERS.targetScore || 700}"></label>
      <label>Target rank <input type="number" id="wTargetRank" value="${WIZARD_ANSWERS.targetRank || 500}"></label>
      <div class="wiz-actions"><button class="btn" id="wizBack">← Back</button><button class="btn primary" id="wizFinish">Build my plan →</button></div>
    `,
    wire: () => {
      $('#wizBack').addEventListener('click', prevStep);
      $('#wizFinish').addEventListener('click', () => {
        WIZARD_ANSWERS.targetScore = Number($('#wTargetScore').value || 700);
        WIZARD_ANSWERS.targetRank = Number($('#wTargetRank').value || 500);
        finishSetup();
      });
    }
  }
];

function renderWizardStep() {
  const step = WIZARD_STEPS[wizardStep];
  $('#setupBody').innerHTML = `
    <div class="wiz-progress">${WIZARD_STEPS.map((_, i) => `<span class="${i <= wizardStep ? 'on' : ''}"></span>`).join('')}</div>
    ${step.render()}
  `;
  step.wire();
}
function nextStep() { wizardStep = Math.min(wizardStep + 1, WIZARD_STEPS.length - 1); renderWizardStep(); }
function prevStep() { wizardStep = Math.max(wizardStep - 1, 0); renderWizardStep(); }

function finishSetup() {
  state.examDate = WIZARD_ANSWERS.examDate || state.examDate;
  state.examDateConfirmed = !!WIZARD_ANSWERS.examDateConfirmed;
  state.initialCompletionPct = WIZARD_ANSWERS.initialCompletionPct || 0;
  state.startingLevel = WIZARD_ANSWERS.startingLevel || 'zero';
  state.dailyHoursGoal = WIZARD_ANSWERS.dailyHoursGoal || 5;
  state.weeklyHoursGoal = Math.round(state.dailyHoursGoal * 6.5);
  state.monthlyHoursGoal = Math.round(state.dailyHoursGoal * 26);
  state.preferredStudyTime = WIZARD_ANSWERS.preferredStudyTime || 'Morning';
  state.strengths = WIZARD_ANSWERS.strengths || [];
  state.weakSubjects = WIZARD_ANSWERS.weakSubjects || [];
  state.targetScore = WIZARD_ANSWERS.targetScore || 700;
  state.targetRank = WIZARD_ANSWERS.targetRank || 500;
  state.startDate = todayStr();
  state.setupDone = true;
  saveState();
  boot();
}

/* ---------------- Boot ---------------- */
function boot() {
  document.documentElement.setAttribute('data-theme', state.darkMode ? 'dark' : 'light');
  renderShell();
  render();
}

window.addEventListener('DOMContentLoaded', () => {
  if (state.setupDone) boot();
  else renderSetup();
});

</script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(err => console.warn('PWA service worker:', err)));
}
</script>
